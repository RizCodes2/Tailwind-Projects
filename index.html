        <div></div>

    </header>
    <script>
        const images = ["./Resources/backs/back1.jpg", "./Resources/backs/back2.jpg", "./Resources/backs/back3.jpg", "./Resources/backs/back4.jpg", "./Resources/backs/back5.jpg", "./Resources/backs/back6.jpg", "./Resources/backs/back7.jpg"];



        const imgsrc = document.getElementById("slider-img");


        let count = 0;
        function autoslider() {
            setInterval(() => {
                count++;
                if (count === images.length - 1) {
                    count = 0;

                }
                imgsrc.style.transform = 'scale(1)';
                imgsrc.style.transition = 'none';

                setTimeout(() => {
                    imgsrc.style.transition = 'transform 1s ease-in-out';
                    imgsrc.style.transform = 'scale(1.1)';
                }, 50);

                imgsrc.src = `${images[count]}`;


            }, 3000);
        }

        window.addEventListener("load", autoslider);

    </script>
